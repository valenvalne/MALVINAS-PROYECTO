services:
  db:
    image: postgres:16-alpine
    container_name: malvinas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malvinas}
      POSTGRES_USER: ${POSTGRES_USER:-malvinas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-malvinas}
    ports:
      - "5441:5432"
    volumes:
      - malvinas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: malvinas_agente_ia
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - ./files_storage:/app/files_storage
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - RUNNING_IN_DOCKER=1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  malvinas_pgdata:
